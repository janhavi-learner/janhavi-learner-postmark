<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ece8e1">
<title>Postmark</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="stamp" aria-label="Painting"></canvas>
    <p id="engine-message" hidden></p>
  </main>

  <footer id="tools">
    <div class="row" id="brushes" role="radiogroup" aria-label="Brush">
      <button type="button" role="radio" data-brush="small" aria-label="Small brush">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2.5" class="fill"/></svg>
        <span>Small</span>
      </button>
      <button type="button" role="radio" data-brush="medium" aria-label="Medium brush">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" class="fill"/></svg>
        <span>Medium</span>
      </button>
      <button type="button" role="radio" data-brush="large" aria-label="Large brush">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" class="fill"/></svg>
        <span>Large</span>
      </button>
      <button type="button" role="radio" data-brush="detail" aria-label="Detail brush">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19c4-1 9-6 14-14" class="line"/></svg>
        <span>Detail</span>
      </button>
      <button type="button" role="radio" data-brush="wet" aria-label="Wet brush: softens without adding color">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c3 4 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.5-6 5.5-10z" class="line"/></svg>
        <span>Wet</span>
      </button>
    </div>

    <div class="row" id="color-bar">
      <div id="swatches" role="radiogroup" aria-label="Color"></div>
      <button type="button" id="palette-button" class="icon" aria-label="Change palette">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 0 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.2-1-1.5-1-2.6 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z" class="line"/><circle cx="7.5" cy="11" r="1.2" class="fill"/><circle cx="10" cy="7" r="1.2" class="fill"/><circle cx="14.5" cy="7" r="1.2" class="fill"/></svg>
      </button>
    </div>

    <div class="row" id="actions">
      <label class="water">
        <span class="visually-hidden">Water amount</span>
        <svg viewBox="0 0 24 24" aria-hidden="true" class="drop-small"><path d="M12 8c1.5 2 2.8 3.5 2.8 5a2.8 2.8 0 0 1-5.6 0c0-1.5 1.3-3 2.8-5z" class="line"/></svg>
        <input id="water" type="range" min="0" max="1" step="0.01" value="0.3">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5c3 4 5.5 7 5.5 10a5.5 5.5 0 0 1-11 0c0-3 2.5-6 5.5-10z" class="line"/></svg>
      </label>
      <button type="button" id="undo" class="icon" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h11a5 5 0 0 1 0 10h-2" class="line"/></svg>
      </button>
      <button type="button" id="redo" class="icon" aria-label="Redo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 7 5 5-5 5m5-5H9a5 5 0 0 0 0 10h2" class="line"/></svg>
      </button>
      <button type="button" id="clear" class="icon" aria-label="Clear painting">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" class="line"/></svg>
      </button>
    </div>
  </footer>
</div>

<section id="palette-sheet" class="sheet" aria-label="Colors" hidden></section>

<dialog id="confirm-clear">
  <form method="dialog">
    <p>Clear the painting?</p>
    <p class="hint">You can undo this.</p>
    <div class="dialog-buttons">
      <button value="cancel">Keep painting</button>
      <button value="clear" class="danger">Clear</button>
    </div>
  </form>
</dialog>

<pre id="errors" hidden></pre>
<script type="module" src="/src/main.js"></script>
</body>
</html>
